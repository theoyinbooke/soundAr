name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    name: Verify source
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      - name: Validate version metadata
        run: ./scripts/check-release-version.sh
      - name: Install Tauri build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - name: Install frontend dependencies
        working-directory: app
        run: npm ci
      - name: Audit production frontend dependencies
        working-directory: app
        run: npm audit --omit=dev
      - name: Build frontend
        working-directory: app
        run: npm run build
      - name: Check Rust formatting
        working-directory: app/src-tauri
        run: cargo fmt --check
      - name: Test native shell
        working-directory: app/src-tauri
        run: cargo test --locked
      - name: Compile Python runtime
        run: python3 -m compileall -q bridge.py config core engines
      - name: Validate installer scripts
        run: bash -n install-linux.sh setup-runtime.sh install.sh
