name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    name: Verify source
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-test.txt
      - name: Validate version metadata
        run: ./scripts/check-release-version.sh
      - name: Install Tauri build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev libasound2-dev patchelf
      - name: Install frontend dependencies
        working-directory: app
        run: npm ci
      - name: Audit production frontend dependencies
        working-directory: app
        run: npm audit --omit=dev
      - name: Build frontend
        working-directory: app
        run: npm run build
      - name: Verify production truth boundary
        run: ./scripts/verify-production-boundary.sh
      - name: Verify runtime dependency policy
        run: ./scripts/verify-runtime-security.sh
      - name: Test frontend units
        working-directory: app
        run: npm test
      - name: Install Playwright browser
        working-directory: app
        run: npx playwright install --with-deps chromium
      - name: Test responsive browser preview
        working-directory: app
        run: npm run test:e2e
      - name: Test production runtime boundary
        working-directory: app
        run: npm run test:production
      - name: Check Rust formatting
        working-directory: app/src-tauri
        run: cargo fmt --check
      - name: Test native shell
        working-directory: app/src-tauri
        run: cargo test --locked
      - name: Compile Python runtime
        run: python3 -m compileall -q bridge.py model_cli.py config core engines
      - name: Test Python runtime contracts
        run: |
          python3 -m pip install --requirement requirements-test.txt
          python3 -m unittest discover -s tests -v
      - name: Validate installer and package-verification scripts
        run: bash -n install-linux.sh setup-runtime.sh setup-engine-runtime.sh install.sh scripts/verify-production-boundary.sh scripts/verify-runtime-security.sh scripts/verify-linux-bundles.sh scripts/verify-package-journey.sh
