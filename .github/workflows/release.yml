name: Release Linux desktop

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  id-token: write
  attestations: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  linux:
    name: Build and publish Linux
    if: github.repository == 'theoyinbooke/soundAr'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      - name: Validate release version
        run: ./scripts/check-release-version.sh "$GITHUB_REF_NAME"
      - name: Install Tauri build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - name: Install frontend dependencies
        working-directory: app
        run: npm ci
      - name: Verify source before packaging
        run: |
          npm run build --prefix app
          cargo fmt --check --manifest-path app/src-tauri/Cargo.toml
          cargo test --locked --manifest-path app/src-tauri/Cargo.toml
          python3 -m compileall -q bridge.py config core engines
          bash -n install-linux.sh setup-runtime.sh install.sh
      - name: Build packages and create GitHub release
        uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
        with:
          projectPath: app
          tagName: v__VERSION__
          releaseName: soundAr v__VERSION__
          releaseBody: See the generated release notes and CHANGELOG.md for details.
          releaseDraft: true
          prerelease: false
          generateReleaseNotes: true
          uploadUpdaterJson: true
          uploadUpdaterSignatures: true
          retryAttempts: 3
          args: --bundles deb,appimage
      - name: Verify Linux bundles
        run: ./scripts/verify-linux-bundles.sh "${GITHUB_REF_NAME#v}"
      - name: Create checksums
        run: |
          version="${GITHUB_REF_NAME#v}"
          sha256sum \
            "app/src-tauri/target/release/bundle/deb/soundAr_${version}_amd64.deb" \
            "app/src-tauri/target/release/bundle/deb/soundAr_${version}_amd64.deb.sig" \
            "app/src-tauri/target/release/bundle/appimage/soundAr_${version}_amd64.AppImage" \
            "app/src-tauri/target/release/bundle/appimage/soundAr_${version}_amd64.AppImage.sig" \
            install-linux.sh setup-runtime.sh requirements-runtime.txt > SHA256SUMS
      - name: Attest release packages
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: |
            app/src-tauri/target/release/bundle/deb/soundAr_*.deb
            app/src-tauri/target/release/bundle/appimage/soundAr_*.AppImage
      - name: Attach installer, runtime manifest, and checksums
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "$GITHUB_REF_NAME" install-linux.sh setup-runtime.sh requirements-runtime.txt SHA256SUMS --clobber
      - name: Verify draft release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          assets="$(gh release view "$GITHUB_REF_NAME" --json assets --jq '.assets[].name')"
          version="${GITHUB_REF_NAME#v}"
          for asset in \
            "soundAr_${version}_amd64.deb" \
            "soundAr_${version}_amd64.deb.sig" \
            "soundAr_${version}_amd64.AppImage" \
            "soundAr_${version}_amd64.AppImage.sig" \
            latest.json install-linux.sh setup-runtime.sh requirements-runtime.txt SHA256SUMS; do
            grep -Fxq "$asset" <<<"$assets" || { echo "Missing release asset: $asset" >&2; exit 1; }
          done
      - name: Publish verified release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release edit "$GITHUB_REF_NAME" --draft=false --latest
