[package]
name = "soundar-desktop"
version = "0.3.2"
description = "Open-source local voice studio"
authors = ["soundAr"]
edition = "2021"
license = "MIT"
homepage = "https://github.com/theoyinbooke/soundAr"
repository = "https://github.com/theoyinbooke/soundAr"

[lib]
name = "soundar_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock"] }
cpal = "0.15"
csv = "1"
hound = "3"
rusqlite = { version = "0.32", features = ["backup", "bundled"] }
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-process = "2"
uuid = { version = "1", features = ["v4"] }

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-updater = "2"
